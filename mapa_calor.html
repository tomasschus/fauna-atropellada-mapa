const SP_SET  = new Set(SPECIES.map(s => s[0].toLowerCase()));

const map = L.map('map', { preferCanvas:true }).setView([-38.5, -63.5], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let heat = null;
function render() {
  const prov = document.getElementById('prov').value;
  const spRaw = document.getElementById('sp').value.trim();
  const spLc = spRaw.toLowerCase();
  const spExact = SP_SET.has(spLc);

  let filtered = POINTS;
  if (prov !== '__all__') filtered = filtered.filter(p => p[2] === prov);
  if (spRaw) {
    filtered = spExact
      ? filtered.filter(p => p[3].toLowerCase() === spLc)
      : filtered.filter(p => p[3].toLowerCase().includes(spLc));
  }

  const data = filtered.map(p => [p[0], p[1], 1]);
  if (heat) map.removeLayer(heat);
  heat = L.heatLayer(data, { radius: 18, blur: 22, maxZoom: 10, minOpacity: 0.25 }).addTo(map);

  document.getElementById('stats').innerHTML =
    '<span class="badge">' + data.length.toLocaleString('es-AR') + '</span> registros'
    + (spRaw ? ' &middot; especie: <b>' + spRaw + '</b>' : '');

  if (data.length && (prov !== '__all__' || spRaw)) {
    const lats = data.map(d=>d[0]), lngs = data.map(d=>d[1]);
    map.fitBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]],
                  { padding:[40,40], maxZoom: 11 });
  } else if (prov === '__all__' && !spRaw) {
    map.setView([-38.5, -63.5], 5);
  }
}

document.getElementById('prov').addEventListener('change', render);
let spT;
document.getElementById('sp').addEventListener('input', () => {
  clearTimeout(spT); spT = setTimeout(render, 200);
});
document.getElementById('clear').addEventListener('click', () => {
  document.getElementById('prov').value = '__all__';
  document.getElementById('sp').value = '';
  document.getElementById('parks').checked = false;
  if (parksLayer) parksLayer.remove();
  render();
});

let parksLayer = null;
function styleFor(feat) {
  const v = feat.properties && feat.properties.visits_total;
  return v && v > 0
    ? { color: '#1b5e20', weight: 1.2, fillColor: '#43a047', fillOpacity: 0.35 }
    : { color: '#558b2f', weight: 0.5, fillColor: '#aed581', fillOpacity: 0.18 };
}
async function loadParks() {
  if (parksLayer) return parksLayer;
  const cb = document.getElementById('parks');
  const label = cb.parentElement;
  label.style.opacity = 0.6;
  try {
    const r = await fetch('area_protegida_enriched.geojson');
    const geo = await r.json();
    parksLayer = L.geoJSON(geo, {
      style: styleFor,
      onEachFeature: (feat, layer) => {
        const p = feat.properties || {};
        const name = p.display_name || p.fna || 'Área protegida';
        const visits = (p.visits_total && p.visits_total > 0)
          ? `<b>${p.visits_total.toLocaleString('es-AR')}</b> visitas acumuladas (CSV: ${p.csv_name})`
          : '<span style="color:#888">sin datos de visitas</span>';
        layer.bindPopup(`<b>${name}</b><br>${visits}<br><span style="color:#888">${p.fdc || ''}</span>`);
        layer.bindTooltip(name, { sticky: true });
      }
    });
  } finally {
    label.style.opacity = 1;
  }
  return parksLayer;
}
document.getElementById('parks').addEventListener('change', async e => {
  const layer = await loadParks();
  if (e.target.checked) {
    layer.addTo(map);
  } else {
    layer.remove();
  }
});
render();
</script>
